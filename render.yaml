services:
  - type: web
    name: hms-backend
    env: python
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build && cd .. && python manage.py migrate && python manage.py init_data
    startCommand: gunicorn project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: project.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: "hospital-management-system-rfkq.onrender.com,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hospital-management-system-rfkq.onrender.com,http://hospital-management-system-rfkq.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://hospital-management-system-rfkq.onrender.com,http://hospital-management-system-rfkq.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: hms-db
          property: connectionString
      - key: VITE_API_URL
        value: "https://hospital-management-system-rfkq.onrender.com/api"
    postDeployCommand: python create_test_user.py
    databases:
      - name: hms-db
        databaseName: hms
        user: hms
