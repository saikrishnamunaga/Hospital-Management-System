services:
  - type: web
    name: hms-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "python manage.py migrate --noinput && gunicorn project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: project.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: hms-db
          property: connectionString
    databases:
      - name: hms-db
        databaseName: hms
        user: hms
