services:
  - type: web
    name: hms-backend
    env: python
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt
    startCommand: gunicorn project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: project.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "True"
      - key: ALLOWED_HOSTS
        value: "hospital-management-system-rfqk.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hospital-management-system-rfqk.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: hms-db
          property: connectionString
    databases:
      - name: hms-db
        databaseName: hms
        user: hms
