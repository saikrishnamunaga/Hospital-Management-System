version: '3.8'
services:
  web:
    build: .
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000 --reload
    env_file: .env.example
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - web
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: hms
      POSTGRES_PASSWORD: hms_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
